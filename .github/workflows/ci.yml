name: DevCareerOS CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install backend dependencies
        working-directory: backend
        run: npm install

      - name: Check backend JavaScript syntax
        shell: bash
        run: |
          find backend/src -type f -name "*.js" -print0 |
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build